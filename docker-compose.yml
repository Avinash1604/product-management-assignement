services:
  postgres:
    image: postgres:18
    container_name: products-postgres
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
    ports:
      # Host 5433 -> container 5432 (5432 is often already taken by a local Postgres)
      - "5433:5432"
    volumes:
      # postgres:18 expects the mount at /var/lib/postgresql (data lives in a versioned subdir)
      - products-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products -d products"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  products-pgdata:
