<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Reusable products table fragment, returned for both GET and POST /products -->
<div th:fragment="table">

    <div class="table-meta">
        <wa-badge variant="brand" pill th:text="${products.size()} + ' products'">0 products</wa-badge>
    </div>

    <table class="products-table" th:if="${!products.isEmpty()}">
        <thead>
        <tr>
            <th></th>
            <th>Title</th>
            <th>Vendor</th>
            <th>Type</th>
            <th>Variants</th>
            <th>From</th>
            <th>Stock</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td class="thumb">
                <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" alt="" loading="lazy"/>
                <span th:unless="${product.imageUrl != null}" class="thumb--empty">—</span>
            </td>
            <td class="title-cell" th:text="${product.title}">Title</td>
            <td th:text="${product.vendor} ?: '—'">Vendor</td>
            <td th:text="${product.productType} ?: '—'">Type</td>
            <td>
                <wa-badge variant="neutral" pill th:text="${product.variants.size()}">0</wa-badge>
            </td>
            <td class="price-cell"
                th:text="${product.lowestPrice() != null}
                         ? 'kr ' + ${#numbers.formatDecimal(product.lowestPrice(), 1, 2)}
                         : '—'">kr 0.00
            </td>
            <td>
                <wa-badge th:if="${product.inStock()}" variant="success" pill>In stock</wa-badge>
                <wa-badge th:unless="${product.inStock()}" variant="danger" pill>Sold out</wa-badge>
            </td>
            <td class="action-cell">
                <a th:href="@{/products/{id}/edit(id=${product.id})}" class="action-link">
                    <wa-button variant="neutral" appearance="outlined" size="small">
                        <wa-icon slot="start" name="pen-to-square"></wa-icon>
                        Edit
                    </wa-button>
                </a>

                <!-- Native <dialog> confirms before the product is deleted. -->
                <wa-button variant="danger" appearance="outlined" size="small"
                           onclick="this.nextElementSibling.showModal()">
                    <wa-icon slot="start" name="trash"></wa-icon>
                    Delete
                </wa-button>
                <dialog class="delete-dialog">
                    <h3>Delete product?</h3>
                    <p>This permanently removes
                        “<strong th:text="${product.title}">Title</strong>” from the database.</p>
                    <div class="dialog-actions">
                        <wa-button appearance="outlined"
                                   onclick="this.closest('dialog').close()">Cancel</wa-button>
                        <wa-button variant="danger"
                                   th:attr="hx-delete=@{/products/{id}(id=${product.id})}"
                                   hx-target="closest section"
                                   hx-swap="innerHTML">
                            <wa-icon slot="start" name="trash"></wa-icon>
                            Delete
                        </wa-button>
                    </div>
                </dialog>
            </td>
        </tr>
        </tbody>
    </table>

    <wa-callout variant="neutral" th:if="${products.isEmpty()}">
        <wa-icon slot="icon" name="box-open"></wa-icon>
        No products yet. Add one using the form below.
    </wa-callout>

</div>

</body>
</html>
