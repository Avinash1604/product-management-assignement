spring:
  application:
    name: product-management
  datasource:
    url: jdbc:postgresql://localhost:5433/products
    username: products
    password: products
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only validates it matches the entities
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false

# Source of truth for the seed data + how many products to keep
famme:
  products-url: https://famme.no/products.json
  max-products: 50

logging:
  level:
    com.example.products: INFO
